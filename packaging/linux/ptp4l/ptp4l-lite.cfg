# ptp4l for triib's talkers and listeners once they fall back to AVB
# Lite: the AVB Lite PTP profile (avbcommunity/profiles, avb_lite.md,
# section 5), IEEE 1588 over Ethernet, delay measured end to end, Sync
# every 125 ms and Announce every second. It only follows time, as the
# gPTP configuration does. Every AVB Lite device on the network shares
# one domain; change domainNumber here to move to another.
# triib-ptp4l-lite@<interface> runs it.
[global]
domainNumber            0
clientOnly              1
priority1               255
priority2               255
logAnnounceInterval     0
logSyncInterval         -3
logMinDelayReqInterval  0
announceReceiptTimeout  3
transportSpecific       0x0
ptp_dst_mac             01:1B:19:00:00:00
network_transport       L2
delay_mechanism         E2E
time_stamping           hardware
