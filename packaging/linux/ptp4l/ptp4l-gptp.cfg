# ptp4l for triib's talkers and listeners on an AVB network: a gPTP
# (IEEE 802.1AS) end station that only follows time, as linuxptp's
# configs/gPTP.cfg with gmCapable 0. triib-ptp4l-gptp@<interface> runs it,
# and triib-endpointd moves to ptp4l-lite.cfg when its endpoints fall back
# to AVB Lite.
[global]
gmCapable               0
priority1               255
priority2               255
logAnnounceInterval     0
logSyncInterval         -3
syncReceiptTimeout      3
neighborPropDelayThresh 800
min_neighbor_prop_delay -20000000
assume_two_step         1
path_trace_enabled      1
follow_up_info          1
transportSpecific       0x1
ptp_dst_mac             01:80:C2:00:00:0E
network_transport       L2
delay_mechanism         P2P
time_stamping           hardware
