[package]
name = "triib"
description = "Lightweight ATDECC and Milan controller"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
iced = { version = "0.14", features = ["advanced", "canvas"] }
serde = { version = "1", features = ["derive"] }
scramble-ui.workspace = true
atdecc = { workspace = true, features = ["std"] }
avb-mrp.workspace = true
avb-net = { workspace = true, features = ["std"] }
triib-store.workspace = true
triib-endpointd = { path = "../triib-endpointd" }
triib-stream = { path = "../triib-stream" }
i18n-embed = { version = "0.16", features = ["desktop-requester", "fluent-system"] }
i18n-embed-fl = "0.10"
rust-embed = { version = "8", features = ["debug-embed"] }

[dev-dependencies]
iced_test = "0.14"
