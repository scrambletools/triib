[package]
name = "avb-net"
description = "Raw Ethernet for AVB protocols: MAC addresses, interfaces, and frames with hardware timestamps"
version = "0.1.0"
categories = ["network-programming", "no-std"]
keywords = ["avb", "tsn", "ethernet", "raw-socket"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["std"]
# Interfaces and frame I/O on Linux, macOS and Windows. Without it only the
# address types remain, for protocol crates built for microcontrollers.
std = ["dep:libc", "dep:windows-sys"]

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[[example]]
name = "listen"
required-features = ["std"]

[[example]]
name = "phc_watch"
required-features = ["std"]
