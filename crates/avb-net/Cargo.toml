[package]
name = "avb-net"
description = "Raw Ethernet for AVB protocols: MAC addresses, interfaces, and frames with hardware timestamps"
version = "0.1.0"
categories = ["network-programming", "no-std"]
keywords = ["avb", "tsn", "ethernet", "raw-socket"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["std"]
# Interfaces and frame I/O on Linux, macOS and Windows. Without it only the
# address types remain, for protocol crates built for microcontrollers.
std = ["dep:libc"]

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2", optional = true }
