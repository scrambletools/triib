[package]
name = "avb-mrp"
description = "IEEE 802.1Q MRP, MSRP and MVRP: attribute declaration and stream reservation state machines, without I/O"
version = "0.1.0"
categories = ["network-programming", "no-std"]
keywords = ["avb", "tsn", "msrp", "mvrp", "srp"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["std"]
# Raw Ethernet on Linux, macOS and Windows through avb-net, and a blocking
# driver for apps that do not bring their own loop.
std = ["avb-net/std"]

[dependencies]
avb-net.workspace = true
